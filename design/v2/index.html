<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ShipWith.AI — Foundry</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..700&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', system-ui, sans-serif;
    background: #f0eee9;
    color: #1a1612;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  * { font-variant-numeric: tabular-nums; }
  *:focus-visible { outline: 2px solid #A8311C; outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="foundry.jsx"></script>

<script type="text/babel" data-presets="react">
const { FoundryLanding, FoundryWorkspace } = window;

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="intro"
        title="ShipWith.AI — Foundry"
        subtitle="The chosen direction. Two screens at full scale. Open SPEC.md in the file tree for the Claude Code handoff document."
      >
        <DCArtboard id="readme" label="README" width={520} height={720}>
          <div style={{padding:'40px 44px', fontFamily:'Geist, system-ui, sans-serif', color:'#1A1612', background:'#F1ECE2', height:'100%', boxSizing:'border-box', overflow:'auto'}}>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:24}}>
              <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="5.5" fill="none" stroke="#1A1612" strokeWidth="1.1"/><line x1="9" y1="0" x2="9" y2="18" stroke="#1A1612" strokeWidth="1.1"/><line x1="0" y1="9" x2="18" y2="9" stroke="#1A1612" strokeWidth="1.1"/></svg>
              <span style={{fontFamily:'Newsreader, Georgia, serif', fontStyle:'italic', fontSize:22, letterSpacing:'-0.01em'}}>ShipWith<span style={{color:'#A8311C'}}>.AI</span></span>
            </div>

            <div style={{fontFamily:'JetBrains Mono, monospace', fontSize:10, letterSpacing:'0.22em', color:'#857C6E', textTransform:'uppercase', marginBottom:8}}>Direction · Foundry · v1.1</div>
            <h1 style={{fontFamily:'Newsreader, Georgia, serif', fontWeight:300, fontSize:44, lineHeight:0.96, letterSpacing:'-0.03em', margin:'0 0 24px'}}>
              The studio<br/>
              in <em>daylight</em><span style={{color:'#A8311C'}}>.</span>
            </h1>

            <p style={{fontFamily:'Newsreader, Georgia, serif', fontSize:17, lineHeight:1.55, color:'#4D453B', margin:'0 0 24px', textWrap:'pretty'}}>
              Cream paper. Deep ink. A single vermilion accent. The system
              repositions ShipWith.AI as an <em>atelier</em> — a studio of
              specialist agents you commission, not a chatbot.
            </p>

            <div style={{borderTop:'1px solid rgba(26,22,18,0.16)', paddingTop:18, marginBottom:18}}>
              <div style={{fontSize:10, letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:600, color:'#1A1612', marginBottom:10}}>The system</div>
              <ul style={{margin:0, padding:0, listStyle:'none', display:'flex', flexDirection:'column', gap:8, fontSize:13, color:'#4D453B', lineHeight:1.5}}>
                <li>· <strong style={{color:'#1A1612'}}>Newsreader</strong> — editorial serif, screen-tuned</li>
                <li>· <strong style={{color:'#1A1612'}}>Geist</strong> — UI sans, replaces generic Inter</li>
                <li>· <strong style={{color:'#1A1612'}}>JetBrains Mono</strong> — data, timestamps, system</li>
                <li>· Hairline rules. No shadows, gradients, or glow.</li>
                <li>· Roman numerals · small-caps labels · baseline grid</li>
                <li>· One accent <span style={{color:'#A8311C'}}>—</span> used sparingly</li>
              </ul>
            </div>

            <div style={{borderTop:'1px solid rgba(26,22,18,0.16)', paddingTop:18, marginBottom:18}}>
              <div style={{fontSize:10, letterSpacing:'0.22em', textTransform:'uppercase', fontWeight:600, color:'#1A1612', marginBottom:10}}>What you're looking at</div>
              <div style={{display:'flex', flexDirection:'column', gap:10, fontSize:13, color:'#4D453B', lineHeight:1.5}}>
                <div style={{display:'flex', alignItems:'baseline', gap:8}}>
                  <span style={{fontFamily:'Newsreader, Georgia, serif', fontStyle:'italic', fontSize:14, color:'#A8311C', minWidth:18}}>i.</span>
                  <span><strong style={{color:'#1A1612'}}>Landing</strong> — masthead, hero, two commission briefs, in-progress folios, colophon.</span>
                </div>
                <div style={{display:'flex', alignItems:'baseline', gap:8}}>
                  <span style={{fontFamily:'Newsreader, Georgia, serif', fontStyle:'italic', fontSize:14, color:'#A8311C', minWidth:18}}>ii.</span>
                  <span><strong style={{color:'#1A1612'}}>Workspace</strong> — top bar, three-column layout, correspondence, phase timeline.</span>
                </div>
              </div>
            </div>

            <div style={{padding:'14px 16px', background:'rgba(168,49,28,0.06)', borderLeft:'2px solid #A8311C'}}>
              <div style={{fontSize:10, letterSpacing:'0.2em', textTransform:'uppercase', color:'#A8311C', fontWeight:600, marginBottom:6}}>For Claude Code</div>
              <div style={{fontSize:13, color:'#1A1612', lineHeight:1.5}}>
                Open <span style={{fontFamily:'JetBrains Mono, monospace', fontSize:12, background:'rgba(26,22,18,0.06)', padding:'1px 6px'}}>SPEC.md</span> — full token table, type scale, per-component anatomy with pixel measurements, copy-replacement table, and a numbered build checklist. If a value isn't in the spec, eyedropper the artboard and add it.
              </div>
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="foundry"
        title="I. Foundry — v3 (app-fit pass)"
        subtitle="v3 strips editorial chrome (issue numbers, colophons, eyebrow labels) and rebuilds both screens to fit 1440×900 exactly. Workspace scroll is now inside the chat region only."
      >
        <DCArtboard id="foundry-landing-v3" label="Landing · v3 (fits viewport)" width={1440} height={900}>
          <FoundryLanding />
        </DCArtboard>
        <DCArtboard id="foundry-workspace-v3" label="Workspace · v3 (fits viewport)" width={1440} height={900}>
          <FoundryWorkspace />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
